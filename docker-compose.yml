# Run on the Oracle VM:  docker compose up -d --build
# Needs backend/.env (MONGO_URI, JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD) and ./.env with API_DOMAIN.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in ./.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
