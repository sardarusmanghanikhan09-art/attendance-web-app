name: Check-in reminder push
# Vercel's free plan only runs cron jobs once a day, so GitHub calls the reminder endpoint instead.
# Every 10 minutes, Monday to Saturday, 8:00 AM to 5:59 PM Pakistan time (03:00-12:59 UTC).
# GitHub may start scheduled runs a few minutes late; that is fine for reminders.
on:
  schedule:
    - cron: '*/10 3-12 * * 1-6'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send reminders to employees who have not checked in
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret first"; exit 1; fi
          curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://attendance-web-app-eight.vercel.app/api/cron/checkin-reminders
